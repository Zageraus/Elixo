name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    name: Backend (Prisma, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Only used to validate the schema; no database is contacted.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma validate
      - run: npm run typecheck
      - run: npm run build

  frontend:
    name: Frontend (typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  contracts:
    name: Smart contract tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci
      - run: npm test

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Pushing needs the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository
      # secrets; without them the images are only built.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: ${{ env.DOCKERHUB_USERNAME != '' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ env.DOCKERHUB_USERNAME || 'elixor' }}/elixor-backend:latest
      - name: Frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: ${{ env.DOCKERHUB_USERNAME != '' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ env.DOCKERHUB_USERNAME || 'elixor' }}/elixor-frontend:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.PUBLIC_API_URL || 'http://localhost:4000' }}
